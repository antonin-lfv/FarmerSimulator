services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verdance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verdance}
      POSTGRES_DB: ${POSTGRES_DB:-verdance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verdance} -d ${POSTGRES_DB:-verdance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-verdance}:${POSTGRES_PASSWORD:-verdance}@db:5432/${POSTGRES_DB:-verdance}
      CORS_ORIGINS: http://localhost:3000,http://verdance.test
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Relative, not absolute — the browser reaches the API through Caddy
        # on whatever host it's browsing from (verdance.test), so this must
        # not hardcode localhost. See ./Caddyfile.
        NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
